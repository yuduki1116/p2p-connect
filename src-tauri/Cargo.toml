[package]
name = "p2p_connect"
version = "0.3.0"
edition = "2021"

[lib]
name = "p2p_connect_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
iroh = "=0.35.0"
tokio = { version = "1", features = ["full"] }
bytes = "1"
