name: build-mobile
on:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: 20 }

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: android

      # ランナーに入っているAndroid SDKをそのまま使う(setup-androidは使わない)
      - name: NDK
        run: |
          SDKM=$(ls -d $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | head -n1)
          yes | $SDKM --licenses > /dev/null || true
          $SDKM "ndk;27.0.12077973"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> $GITHUB_ENV

      - run: npm install
      - run: npx tauri icon app-icon.png
      - run: npx tauri android init

      # debugキーで自動署名されるので、そのまま端末にインストールできるAPKになる
      - run: npx tauri android build --apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: p2p_connect-android
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

  ios:
    # 署名なしのipaを作る。Sideloadlyなどで自分のApple IDで署名して入れる(無料IDなら7日間有効)
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: 20 }

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ios

      - run: npm install
      - run: npx tauri icon app-icon.png
      - run: npx tauri ios init

      - name: コード署名を無効化
        run: |
          python3 - <<'EOF'
          import glob
          p = glob.glob("src-tauri/gen/apple/*.xcodeproj/project.pbxproj")[0]
          s = open(p).read()
          s = s.replace("buildSettings = {", "buildSettings = {\n\t\t\t\tCODE_SIGNING_ALLOWED = NO;\n\t\t\t\tCODE_SIGNING_REQUIRED = NO;")
          open(p, "w").write(s)
          EOF

      # 最後のexport(署名)は失敗するので無視。archiveまでできていればOK
      - name: Build
        run: npx tauri ios build || true

      - name: ipaにまとめる
        run: |
          APP=$(find src-tauri/gen/apple/build -type d -name "*.app" | head -n1)
          if [ -z "$APP" ]; then
            APP=$(find ~/Library/Developer/Xcode/DerivedData -type d -name "*.app" -path "*iphoneos*" | head -n1)
          fi
          echo "APP=$APP"
          test -n "$APP"
          mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          cd out && zip -qry p2p_connect_unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: p2p_connect-ios-unsigned
          path: out/p2p_connect_unsigned.ipa
          if-no-files-found: error
