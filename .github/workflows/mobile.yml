name: build-mobile
on:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - name: NDK
        run: |
          sdkmanager "ndk;27.0.12077973"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> $GITHUB_ENV
      - run: npm install
      - run: npx tauri icon app-icon.png
      - run: npx tauri android init
      - run: npx tauri android build --apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: p2p_connect-android
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk

  ios:
    # Apple Developer の署名が必要。Secrets を用意するまでは失敗します
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: aarch64-apple-ios }
      - run: npm install
      - run: npx tauri icon app-icon.png
      - run: npx tauri ios init
      - run: npx tauri ios build --debug
      - uses: actions/upload-artifact@v4
        with:
          name: p2p_connect-ios
          path: src-tauri/gen/apple/build/**/*
